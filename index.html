<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20A38D" />
    <title>Shankh Logistics | Reliable Freight & Transport Across India</title>
    <meta
      name="description"
      content="Shankh Logistics offers full truck load, part load, warehousing and express freight services with GPS-tracked vehicles and verified drivers. Book your shipment online."
    />
      <script>
      (function () {
        try {
          var t = localStorage.getItem('shankh-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
